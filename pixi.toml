[workspace]
name = "xmatcher"
channels = ["conda-forge"]
# macOS 14+: torchfits, a torchsky dependency (torchsky environment, same solve
# group), publishes no older macOS wheels.
platforms = [{ name = "osx-arm64-macos-14-0", platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[tasks]
lint = "ruff check ."
format = "ruff format ."
preflight-push = "ruff check . && ruff format --check . && mypy src/xmatcher tests scripts && python -m compileall -q src/xmatcher tests scripts"
ci-local = { cmd = "python -m pytest -m 'not slow and not bench' -q --strict-markers", depends-on = ["preflight-push"] }
install-git-hooks = "bash scripts/install-git-hooks.sh"
test = "python -m pytest"

[dependencies]
# The release runtime. An open bound re-solves to the newest CPython (3.15),
# for which Ray publishes no wheels.
python = "3.13.*"
# numba (via hats) constrains numpy itself; no pin needed here
numpy = "*"
scipy = "*"
astropy = "*"
pyyaml = "*"
pyvo = "*"
astroquery = "*"
pyarrow = "*"
polars = "*"
ruff = "*"
pytest = "*"
mypy = "*"

[pypi-dependencies]
xmatcher = { path = ".", editable = true }
# HATS-native Ray union engine: always in the dev env so CI runs the new tests.
# (Optional extras `hats` / `hats-ray` / `ray` in pyproject.toml stay for pip users.)
hats = "*"
ray = "*"
cdshealpix = "*"

# Public torchsky (>=0.5.0) and its PyTorch stack, for the torchsky engine,
# epoch-propagation Jacobians and HEALPix coverings: `pixi run -e torchsky ci-local`.
[feature.torchsky.dependencies]
# conda-forge CPU PyTorch shares the environment's OpenMP runtime; the PyPI
# wheel bundles its own libomp, which aborts the process on macOS (OMP #15),
# and on Linux pulls the multi-GB CUDA toolkit.
# cpu_generic, not cpu_mkl: the MKL build would switch the shared solve
# group (and so the default environment) from OpenBLAS to MKL.
pytorch = { version = "2.14.*", build = "cpu_generic*" }

[feature.torchsky.pypi-dependencies]
torchsky = ">=0.5.0"

[feature.torchsky.activation.env]
# Tests assert torchsky is importable instead of skipping its paths.
XMATCHER_EXPECT_TORCHSKY = "1"

[environments]
default = { solve-group = "default" }
torchsky = { features = ["torchsky"], solve-group = "default" }
