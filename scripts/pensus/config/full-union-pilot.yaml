# Example for the mounted CANFAR pilot. Check the current inventory and
# extend this manifest before planning the full release.
order: 7
radius_arcsec: 1.5
pair_radii_arcsec:
  gaia/tmass: 2.0

surveys:
  - tag: gaia
    release: gaia_dr3
    path: gaia/dr3
    id: source_id
    epoch_jyear: 2016.0
    columns: [parallax, parallax_error, pmra, pmdec, ruwe, has_xp_continuous, phot_g_mean_mag, phot_bp_mean_mag, phot_rp_mean_mag]
    bands:
      G:
        filter: Gaia DR3 G
        value: phot_g_mean_flux
        unit: electron/s
        uncertainty: phot_g_mean_flux_error
        uncertainty_kind: sigma
      BP:
        filter: Gaia DR3 BP
        value: phot_bp_mean_flux
        unit: electron/s
        uncertainty: phot_bp_mean_flux_error
        uncertainty_kind: sigma
      RP:
        filter: Gaia DR3 RP
        value: phot_rp_mean_flux
        unit: electron/s
        uncertainty: phot_rp_mean_flux_error
        uncertainty_kind: sigma
  - tag: tmass
    release: twomass_psc
    path: 2mass/psc
    id: designation
    bands:
      J:
        filter: 2MASS/2MASS.J
        value: j_m
        unit: mag
        system: Vega
        uncertainty: j_msigcom
        uncertainty_kind: sigma
        flags: [ph_qual, rd_flg]
      H:
        filter: 2MASS/2MASS.H
        value: h_m
        unit: mag
        system: Vega
        uncertainty: h_msigcom
        uncertainty_kind: sigma
        flags: [ph_qual, rd_flg]
      Ks:
        filter: 2MASS/2MASS.Ks
        value: k_m
        unit: mag
        system: Vega
        uncertainty: k_msigcom
        uncertainty_kind: sigma
        flags: [ph_qual, rd_flg]
