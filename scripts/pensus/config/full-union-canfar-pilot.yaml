# CANFAR pilot with schema-reviewed native projections. Run plan --pilot.
# Match caps are starting values for reciprocal-nearest comparisons.
# Links are pinned for a separate candidate/beam workflow.
pilot_only: true
order: 7
radius_arcsec: 1.0
pair_radii_arcsec:
  gaia/ps1: 0.8
  gaia/tmass: 1.5
  gaia/sdss: 1.1
  legacy/tmass: 1.6

surveys:
  - tag: gaia
    release: gaia_dr3
    path: gaia/dr3
    id: source_id
    pilot_radius_arcsec: 0.5
    epoch_jyear: 2016.0
    position_epoch: {column: ref_epoch, format: jyear}
    columns:
      - phot_g_mean_mag
      - phot_bp_mean_mag
      - phot_rp_mean_mag
      - parallax
      - parallax_error
      - pmra
      - pmdec
      - ref_epoch
      - ruwe
      - has_xp_continuous
      - ra_error
      - dec_error
      - ra_dec_corr
      - pmra_error
      - pmdec_error
      - pmra_pmdec_corr
      - astrometric_params_solved
      - duplicated_source
      - phot_bp_rp_excess_factor
      - phot_bp_n_blended_transits
      - phot_rp_n_blended_transits
    bands:
      g: {"filter": "Gaia DR3 G", "value": "phot_g_mean_flux", "uncertainty": "phot_g_mean_flux_error", "uncertainty_kind": "sigma", "unit": "electron/s", "method": "Gaia mean", "flux_scale_jy": 1.736305931677915e-07, "calibration_id": "Gaia DR3 Table 5.4 AB"}
      bp: {"filter": "Gaia DR3 BP", "value": "phot_bp_mean_flux", "uncertainty": "phot_bp_mean_flux_error", "uncertainty_kind": "sigma", "unit": "electron/s", "method": "Gaia mean", "flux_scale_jy": 2.6207539492470443e-07, "calibration_id": "Gaia DR3 Table 5.4 AB"}
      rp: {"filter": "Gaia DR3 RP", "value": "phot_rp_mean_flux", "uncertainty": "phot_rp_mean_flux_error", "uncertainty_kind": "sigma", "unit": "electron/s", "method": "Gaia mean", "flux_scale_jy": 3.2993337447670226e-07, "calibration_id": "Gaia DR3 Table 5.4 AB"}

  - tag: legacy
    release: legacy_dr11
    path: legacysurvey/dr11
    id: ["RELEASE", "BRICKID", "OBJID"]
    pilot_radius_arcsec: 0.8
    columns:
      - MW_TRANSMISSION_G
      - MW_TRANSMISSION_R
      - MW_TRANSMISSION_I
      - MW_TRANSMISSION_Z
      - MW_TRANSMISSION_W1
      - MW_TRANSMISSION_W2
      - MW_TRANSMISSION_W3
      - MW_TRANSMISSION_W4
      - PHOTSYS
      - TYPE
      - REF_CAT
      - REF_ID
      - REF_EPOCH
      - EBV
      - RA_IVAR
      - DEC_IVAR
    bands:
      G: {"filter": "Legacy DR11 G", "value": "FLUX_G", "uncertainty": "FLUX_IVAR_G", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor model", "flags": ["MASKBITS", "FITBITS", "NOBS_G", "FRACFLUX_G"], "passband_selector": "PHOTSYS"}
      R: {"filter": "Legacy DR11 R", "value": "FLUX_R", "uncertainty": "FLUX_IVAR_R", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor model", "flags": ["MASKBITS", "FITBITS", "NOBS_R", "FRACFLUX_R"], "passband_selector": "PHOTSYS"}
      I: {"filter": "Legacy DR11 I", "value": "FLUX_I", "uncertainty": "FLUX_IVAR_I", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor model", "flags": ["MASKBITS", "FITBITS", "NOBS_I", "FRACFLUX_I"], "passband_selector": "PHOTSYS"}
      Z: {"filter": "Legacy DR11 Z", "value": "FLUX_Z", "uncertainty": "FLUX_IVAR_Z", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor model", "flags": ["MASKBITS", "FITBITS", "NOBS_Z", "FRACFLUX_Z"], "passband_selector": "PHOTSYS"}
      W1: {"filter": "Legacy DR11 W1", "value": "FLUX_W1", "uncertainty": "FLUX_IVAR_W1", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor unWISE forced", "flags": ["MASKBITS", "FITBITS", "NOBS_W1", "FRACFLUX_W1"]}
      W2: {"filter": "Legacy DR11 W2", "value": "FLUX_W2", "uncertainty": "FLUX_IVAR_W2", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor unWISE forced", "flags": ["MASKBITS", "FITBITS", "NOBS_W2", "FRACFLUX_W2"]}
      W3: {"filter": "Legacy DR11 W3", "value": "FLUX_W3", "uncertainty": "FLUX_IVAR_W3", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor unWISE forced", "flags": ["MASKBITS", "FITBITS", "NOBS_W3", "FRACFLUX_W3"]}
      W4: {"filter": "Legacy DR11 W4", "value": "FLUX_W4", "uncertainty": "FLUX_IVAR_W4", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "Tractor unWISE forced", "flags": ["MASKBITS", "FITBITS", "NOBS_W4", "FRACFLUX_W4"]}

  - tag: ps1
    release: ps1_otmo
    path: ps1/otmo
    id: objID
    pilot_radius_arcsec: 0.8
    position_epoch: {column: epochMean, format: mjd, missing_values: [-999]}
    columns:
      - epochMean
      - raMeanErr
      - decMeanErr
      - nDetections
      - nStackDetections
      - ng
      - nr
      - ni
      - nz
      - ny
    bands:
      g_psf: {"filter": "PS1 g", "value": "gMeanPSFMag", "uncertainty": "gMeanPSFMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "PSF", "flags": ["gFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      g_kron: {"filter": "PS1 g", "value": "gMeanKronMag", "uncertainty": "gMeanKronMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "Kron", "flags": ["gFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      r_psf: {"filter": "PS1 r", "value": "rMeanPSFMag", "uncertainty": "rMeanPSFMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "PSF", "flags": ["rFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      r_kron: {"filter": "PS1 r", "value": "rMeanKronMag", "uncertainty": "rMeanKronMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "Kron", "flags": ["rFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      i_psf: {"filter": "PS1 i", "value": "iMeanPSFMag", "uncertainty": "iMeanPSFMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "PSF", "flags": ["iFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      i_kron: {"filter": "PS1 i", "value": "iMeanKronMag", "uncertainty": "iMeanKronMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "Kron", "flags": ["iFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      z_psf: {"filter": "PS1 z", "value": "zMeanPSFMag", "uncertainty": "zMeanPSFMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "PSF", "flags": ["zFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      z_kron: {"filter": "PS1 z", "value": "zMeanKronMag", "uncertainty": "zMeanKronMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "Kron", "flags": ["zFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      y_psf: {"filter": "PS1 y", "value": "yMeanPSFMag", "uncertainty": "yMeanPSFMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "PSF", "flags": ["yFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}
      y_kron: {"filter": "PS1 y", "value": "yMeanKronMag", "uncertainty": "yMeanKronMagErr", "uncertainty_kind": "sigma", "unit": "ABmag", "method": "Kron", "flags": ["yFlags", "qualityFlag", "objInfoFlag"], "missing_values": [-999]}

