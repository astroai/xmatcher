    id: [RERUN, RUN, CAMCOL, FIELD, ID]
    pilot_radius_arcsec: 1.1
    columns:
      - id
      - OBJC_FLAGS
      - OBJC_FLAGS2
      - RESOLVE_STATUS
      - NDETECT
      - EXTINCTION_r
    bands:
      u_psf: {"filter": "SDSS u", "value": "PSFFLUX_u", "uncertainty": "PSFFLUX_IVAR_u", "uncertainty_kind": "inverse_variance", "unit": "nanomaggy", "method": "PSF", "flags": ["FLAGS_u"]}
