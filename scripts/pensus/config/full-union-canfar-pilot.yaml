# Candidate projection for a multi-survey CANFAR pilot. Use plan --pilot.
# Reviewed against first-partition schemas from the mounted November 23 inventory.
# Survey order and radii are provisional. See docs/full-release.md.
order: 7
radius_arcsec: 1.5
pair_radii_arcsec:
